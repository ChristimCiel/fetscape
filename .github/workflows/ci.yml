name: Verify Fetscape
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/rpo/requirements.txt
      - run: python -m pip install -r research/rpo/requirements.txt
      - run: python scripts/verify-rpo-reference.py
      - run: python -m unittest discover -s research/rpo
      - name: Verify runner-provided Chrome
        run: google-chrome --version
      - run: npm run test:e2e
      - run: npm run build:pages
      - run: npm run test:pages
      - name: Upload verified public demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/orbital-intelligence'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  deploy:
    name: Deploy GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/orbital-intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified public demo
        id: deployment
        uses: actions/deploy-pages@v4
